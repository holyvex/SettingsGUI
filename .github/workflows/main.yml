name: Build plugin
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: SettingsGUI/SettingsGUI/pom.xml
      - run: mvn -B clean package
        working-directory: SettingsGUI/SettingsGUI
      - uses: actions/upload-artifact@v4
        with:
          name: SettingsGUI-jar
          path: SettingsGUI/SettingsGUI/target/SettingsGUI-1.0.0.jar
